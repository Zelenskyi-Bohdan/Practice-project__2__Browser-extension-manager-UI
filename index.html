<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght,CRSV@600,0&family=Inter:ital,opsz,wght@0,14..32,700;1,14..32,700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <a class="logo-container" href="./index.html">
          <svg class="logo" width="179" height="41">
            <use href="./images/sprite.svg#-logo"></use>
          </svg>
          <p class="logo-text">Extensions</p>
        </a>
        <button class="theme-btn" type="button">
          <svg width="21" height="21">
            <use class="theme-icon" href="./images/sprite.svg#-icon-moon"></use>
          </svg>
        </button>
      </header>
      <main>
        <section class="extensions-section">
          <div class="extensions-section-top">
            <h1 class="extensions-header">Extensions List</h1>
            <div class="extensions-section-btns">
              <button class="all-btn active" data-filter="all" type="button">
                All
              </button>
              <button class="active-btn" data-filter="active" type="button">
                Active
              </button>
              <button class="inactive-btn" data-filter="inactive" type="button">
                Inactive
              </button>
            </div>
          </div>

          <ul class="extensions"></ul>
        </section>
      </main>
    </div>

    <script src="./main.js" type="module"></script>
  </body>
</html>
